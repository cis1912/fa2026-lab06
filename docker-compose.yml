services:
  localstack:
    image: localstack/localstack:4.13.1
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2
      - DEBUG=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # Optional GUI for browsing what you've created — a third-party,
  # open-source resource browser (https://github.com/DaviReisVieira/stackport).
  # Not required for the lab; useful if you want to see resources visually
  # instead of only through `aws` / `terraform` output.
  stackport:
    image: davireis/stackport:0.4.4
    container_name: stackport
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    depends_on:
      - localstack
